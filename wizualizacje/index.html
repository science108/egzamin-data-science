<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizualizacje zagadnień — Egzamin AGH Data Science</title>
<style>
:root{
  --bg:#0f1720; --panel:#16212e; --panel2:#1d2b3a; --border:#2a3b4d;
  --text:#e6edf3; --muted:#93a4b5; --accent:#4aa3ff; --accent2:#7ee0b8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  padding:24px 20px 60px;
}
header{max-width:1200px; margin:0 auto 28px;}
.crumbs{color:var(--muted); font-size:14px; margin-bottom:8px;}
.crumbs a{color:var(--accent); text-decoration:none;}
.crumbs a:hover{text-decoration:underline;}
h1{margin:0 0 6px; font-size:28px; letter-spacing:-0.01em;}
.subtitle{color:var(--muted); font-size:15px;}
.grid{
  max-width:1200px; margin:0 auto;
  display:grid; gap:20px;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; display:flex; flex-direction:column;
  transition:transform .15s ease, border-color .15s ease;
}
.card:hover{transform:translateY(-2px); border-color:var(--accent);}
.thumb{
  background:var(--panel2); aspect-ratio:16/10;
  display:flex; align-items:center; justify-content:center; cursor:zoom-in;
  overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:contain; display:block;}
.meta{padding:14px 16px 16px;}
.meta h3{margin:0 0 8px; font-size:16px; line-height:1.35;}
.tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{
  font-size:12px; padding:3px 8px; border-radius:999px;
  background:var(--panel2); color:var(--muted); border:1px solid var(--border);
}
.actions{margin-top:10px; display:flex; gap:10px;}
.btn{
  font-size:13px; color:var(--accent); text-decoration:none;
  border:1px solid var(--border); padding:6px 10px; border-radius:8px;
  background:transparent; cursor:pointer;
}
.btn:hover{border-color:var(--accent);}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(6,10,15,.92);
  display:none; align-items:center; justify-content:center; z-index:1000;
  padding:24px; cursor:zoom-out;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox .close{
  position:absolute; top:14px; right:18px; font-size:28px; color:#fff;
  background:none; border:none; cursor:pointer; line-height:1;
}
.lightbox .caption{
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  color:#e6edf3; background:rgba(22,33,46,.85); padding:8px 14px; border-radius:8px;
  font-size:14px; max-width:90%; text-align:center;
}
</style>
</head>
<body>

<header>
  <div class="crumbs"><a href="../">← Powrót do aplikacji egzaminu</a></div>
  <h1>Wizualizacje zagadnień</h1>
  <div class="subtitle">Graficzne ściągi i mapy myśli do tematów egzaminacyjnych. Kliknij obrazek, żeby powiększyć.</div>
</header>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" id="close" aria-label="Zamknij">×</button>
  <img id="lightbox-img" alt="">
  <div class="caption" id="lightbox-caption"></div>
</div>

<script>
const items = [
  {
    file: "techniki-projektowania-algorytmow.png",
    title: "Główne techniki projektowania algorytmów",
    tags: ["algorytmy", "projektowanie"]
  },
  {
    file: "zlozonosc-notacja-O.png",
    title: "Rząd złożoności algorytmów — notacja O(n)",
    tags: ["algorytmy", "złożoność", "notacja O"]
  }
];

const grid = document.getElementById("grid");
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lightbox-img");
const lbCap = document.getElementById("lightbox-caption");

function openLightbox(src, title){
  lbImg.src = src;
  lbImg.alt = title;
  lbCap.textContent = title;
  lb.classList.add("open");
  lb.setAttribute("aria-hidden","false");
}
function closeLightbox(){
  lb.classList.remove("open");
  lb.setAttribute("aria-hidden","true");
  lbImg.src = "";
}
lb.addEventListener("click", closeLightbox);
document.getElementById("close").addEventListener("click", (e)=>{e.stopPropagation(); closeLightbox();});
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeLightbox(); });

for (const it of items){
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <div class="thumb"><img loading="lazy" src="${it.file}" alt="${it.title}"></div>
    <div class="meta">
      <h3>${it.title}</h3>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="actions">
        <a class="btn" href="${it.file}" target="_blank" rel="noopener">Otwórz w nowej karcie</a>
      </div>
    </div>
  `;
  card.querySelector(".thumb").addEventListener("click", ()=> openLightbox(it.file, it.title));
  grid.appendChild(card);
}
</script>

</body>
</html>
